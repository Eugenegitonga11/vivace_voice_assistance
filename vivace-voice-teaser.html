<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vivace voice assistant, coming soon</title>
<meta name="description" content="Meet Vivace, the new voice assistant from Vivace Dermatology and Wellness Center. Coming in 2027.">
<meta name="theme-color" content="#082A22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --green-deep:#082A22;
  --green:#04644F;
  --green-glow:#0B5848;
  --mint:#90BAB1;
  --ink:#F3F1EA;
  --ink-soft:rgba(243,241,234,.72);
  --line:rgba(204,174,107,.35);
  --gold-1:#BD9E60;
  --gold-2:#CCAE6B;
  --gold-3:#DCC077;
  --gold:linear-gradient(100deg,var(--gold-1),var(--gold-3));
  --rose:#E7A3B5;
  --sans:"Josefin Sans","Century Gothic","Futura","Avenir Next",system-ui,sans-serif;
  --script:"Parisienne","Snell Roundhand","Brush Script MT",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Brand is always deep green, so light and dark mode share one palette */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
:root[data-theme="dark"]{ color-scheme: dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-weight:300;
  background:var(--green-deep);
  background-image:radial-gradient(120% 70% at 50% 30%,var(--green-glow) 0%,#06392F 45%,var(--green-deep) 80%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.watermark{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0;overflow:hidden}
.watermark img{width:min(115vw,95vh);height:auto;opacity:.06;transform:translateX(6%)}
main{
  position:relative;z-index:1;
  min-height:100%;
  display:grid;grid-template-rows:auto 1fr auto;
  max-width:720px;margin:0 auto;
  padding:clamp(24px,5vw,44px) clamp(20px,6vw,48px);
  text-align:center;
}
.brand .mark{
  font-family:var(--script);font-size:clamp(3rem,13vw,4.5rem);line-height:.8;margin:0 0 .3rem;
  background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand h1{margin:0;line-height:0}
.brand .logo{width:clamp(150px,44vw,220px);height:auto}
.brand .clinic{
  margin:.7rem 0 0;font-size:clamp(.66rem,2.6vw,.8rem);font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;color:var(--mint);
}
.brand .say{margin:1rem 0 0;font-size:.9rem;color:var(--ink-soft);letter-spacing:.04em}
.brand .say b{font-weight:600;color:var(--gold-3)}
.stage{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vh,26px);padding:clamp(12px,3vh,36px) 0;
}
.intro{font-family:var(--script);font-size:clamp(1.7rem,7vw,2.3rem);color:var(--rose);margin:0;line-height:1.1}
canvas{width:100%;height:clamp(110px,20vh,230px);display:block}
.play{
  appearance:none;border:0;cursor:pointer;
  width:78px;height:78px;border-radius:50%;
  background:var(--gold);color:var(--green-deep);
  display:grid;place-items:center;
  box-shadow:0 0 0 8px rgba(204,174,107,.12);
  transition:transform .15s ease, box-shadow .3s ease;
  -webkit-tap-highlight-color:transparent;
}
.play.on{box-shadow:0 0 0 14px rgba(204,174,107,.1)}
.play:active{transform:scale(.95)}
.play:focus-visible,.voices button:focus-visible{outline:2px solid var(--gold-3);outline-offset:5px}
.play svg{width:28px;height:28px}
.caption{
  min-height:4.6em;max-width:28ch;margin:0;
  font-size:clamp(1.1rem,4.4vw,1.35rem);line-height:1.5;font-weight:300;
  transition:opacity .35s ease;
}
.caption.fade{opacity:0}
.voices{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.voices span{font-size:.85rem;color:var(--ink-soft);margin-right:4px}
.voices button{
  appearance:none;font:inherit;font-size:.85rem;font-weight:400;cursor:pointer;
  padding:.55rem 1.05rem .45rem;border-radius:999px;
  border:1px solid rgba(243,241,234,.25);background:transparent;color:var(--ink);
}
.voices button[aria-pressed="true"]{border-color:var(--gold-2);color:var(--gold-3)}
footer{
  border-top:1px solid var(--line);padding-top:clamp(16px,3vh,24px);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
footer .soon{font-size:clamp(1.15rem,4.6vw,1.45rem);letter-spacing:.08em;margin:0}
footer .soon b{font-weight:600;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
footer .note{font-size:.9rem;color:var(--ink-soft);margin:0;text-align:right;max-width:30ch;line-height:1.5}
@media (max-width:480px){
  footer{flex-direction:column}
  footer .note{text-align:center}
}
@media (prefers-reduced-motion: reduce){.caption,.play{transition:none}}
</style>
</head>

        ctx.lineTo(x2, mid + Math.sin(nx2 * Math.PI * 2 * w.f + t * w.s * 4 + w.p) * amp * env2 * 0.6);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
